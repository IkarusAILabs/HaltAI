[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "haltai"
version = "0.2.0"
description = "Containability assurance for registered AI-agent deployments"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Ikarus AI Labs" }]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[apigateway,dynamodb,ecs,iam,sqs,awslambda]>=5", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "boto3-stubs"]

[project.scripts]
haltai = "haltai.cli:app"
haltai-probe = "haltai.contract:probe_main"

[tool.hatch.build.targets.wheel]
packages = ["src/haltai"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/haltai/cli.py" = ["B008"]  # typer declares options as call defaults
